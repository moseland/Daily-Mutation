services:
  # The Pipeline Runner: Scrapes news and generates the broadcast audio
  morning-mutation:
    build: .
    container_name: morning-mutation
    env_file:
      - .env
    volumes:
      - ./output:/app/output
      - ./assets/intro:/app/assets/intro:ro
      - ./assets/commercials:/app/assets/commercials:ro
      - ./config.yaml:/app/config.yaml:ro
    restart: "no"

  # The Web Dashboard: Optimized Static File Server
  morning-mutation-web:
    image: nginx:alpine
    container_name: morning-mutation-web
    ports:
      - "37542:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro  # Mapped to root so index.html works at /
      - ./output:/usr/share/nginx/output:ro  # Shared volume for generated audio/JSON (non-nested)
      - ./nginx-container.conf:/etc/nginx/conf.d/default.conf:ro
    restart: always