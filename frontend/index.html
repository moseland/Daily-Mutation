<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Morning Mutation</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="app-container">
        <!-- Header & Audio Player -->
        <header class="glass-panel sticky-header">
            <div class="logo">
                <h1>The Morning Mutation</h1>
                <span class="subtitle">with IGOR</span>
            </div>

            <div class="audio-player">
                <p class="broadcast-date" id="broadcast-date">Loading Latest Broadcast...</p>
                <!-- We will rely on built in HTML5 audio controls for simplicity, styled slightly -->
                <audio id="main-audio" controls>
                    <source src="../output/morning_mutation.mp3" type="audio/mpeg">
                    Your browser does not support the audio element.
                </audio>
            </div>
        </header>

        <!-- Main Content Grid -->
        <main class="content-grid">
            <!-- Weather Widget -->
            <section class="weather-widget glass-panel" id="weather-widget">
                <h2 id="weather-title">Today's Weather</h2>
                <div class="weather-content" id="weather-content">
                    <div class="weather-loader">Loading weather data...</div>
                </div>
            </section>

            <!-- News Feed -->
            <section class="news-feed-container">
                <div class="category-filters" id="category-filters">
                    <!-- Filter buttons injected here -->
                </div>
                <div class="news-feed" id="news-feed">
                    <!-- News categories will be injected here -->
                    <div class="feed-loader glass-panel">Loading news stories...</div>
                </div>
            </section>
        </main>

        <footer>
            <p>Generated by The Morning Mutation automated pipeline.</p>
        </footer>
    </div>

    <!-- Markdown Parser for Summaries -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="app.js"></script>
</body>

</html>
